name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Scenarios
        run: AFKPUG_SIM=1 AFKPUG_SIM_DIR="$(mktemp -d)" "$(swift build --show-bin-path)/AFKPug" --simulate all
      - name: Stress scenarios
        run: AFKPUG_SIM=1 AFKPUG_SIM_DIR="$(mktemp -d)" "$(swift build --show-bin-path)/AFKPug" --simulate stress
      - name: Release build
        run: scripts/build.sh --zip
